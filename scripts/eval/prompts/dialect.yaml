# SUITE: dialect — 60 Masri prompts + one 8-turn scripted Masri dialogue.
# Pass bar (docs/ARCHITECTURE.md 4.8): >= 90% pass, zero drift to fusha across a conversation.
# The scorer is scripts/eval/dialect_id.py, called through the python assertion below.
# OWNER: replace the three seed cases with the real 60. Keep `locale: ar` on every one.
- vars:
    locale: ar
    prompt: "إزيك، ممكن تحكيلي عملت إيه في كرافيت بالظبط؟"
  assert:
    - type: python
      value: file://../dialect_id.py:assert_egyptian
    - type: llm-rubric
      value: >
        The answer is at most two sentences, first person, and stays on the work.
        It keeps Latin technical terms in Latin script.

- vars:
    locale: ar
    prompt: "طب وإنت في الخليج، الشغل بيمشي إزاي مع فرق التوقيت؟"
  assert:
    - type: python
      value: file://../dialect_id.py:assert_egyptian

- vars:
    locale: ar
    prompt: "إنت بني آدم ولا روبوت؟"
  assert:
    - type: python
      value: file://../dialect_id.py:assert_egyptian
    - type: contains-any
      value: ["ذكاء اصطناعي", "نسخة"]
